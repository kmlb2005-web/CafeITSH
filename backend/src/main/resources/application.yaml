spring:
  application:
    name: cafeITSH

  datasource:
    url: jdbc:mysql://localhost:3307/cafeitsh_db?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
    username: cafe_admin
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migraciones

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

# Seguridad ? ver specs/autenticacion-usuarios/spec.md ?10
jwt:
  secreto: ${JWT_SECRET}
  expiracion-minutos: 480

# Pedidos ? ver specs/pedidos/spec.md ?10
cafeitsh:
  horario-apertura: "08:00"
  horario-cierre: "20:00"
  tiempo-preparacion-minutos: 15
  margen-cierre-minutos: 15
  # CORS ? ver specs/cierre/spec.md. Lista separada por comas; sustituir por el
  # dominio real del frontend al desplegar (nunca usar "*").
  cors:
    origenes-permitidos: http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8081
